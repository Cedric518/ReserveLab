[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reserve_lab"
version = "0.1.0"
description = "Which reserving method gives the most accurate out-of-sample ultimate-loss predictions and the most reliable uncertainty intervals across different insurance lines?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    'pandas>=3,<4',
    'numpy>=2,<3',
    'matplotlib>=3,<4',
    'streamlit>=1,<2',
    'scipy>=1,<2',
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# find reserve_lab directly under src/, independent of whether the
# editable install (`pip install -e .`) actually resolved - see the note
# in scripts/run_pipeline.py about macOS intermittently hiding that
# install's .pth file.
pythonpath = ["src"]

[tool.ruff]
line-length = 88